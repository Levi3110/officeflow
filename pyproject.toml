[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic-human-agent"
version = "0.1.0"
description = "Expertise-based desktop agents with fenced authority and measured telemetry"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "langgraph>=1,<2", "psutil>=6,<8"]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54", "Pillow>=11", "pyobjc-framework-Quartz>=11; sys_platform == 'darwin'", "pyobjc-framework-ApplicationServices>=11; sys_platform == 'darwin'", "pyobjc-framework-Cocoa>=11; sys_platform == 'darwin'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "ruff>=0.11"]

[project.scripts]
sha = "synthetic_human.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_human"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

